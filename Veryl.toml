[project]
name    = "run_rocket"
version = "0.1.0"

[build]
sources    = ["rtl"]
reset_type = "async_low"

[dependencies]
hns = { git = "https://github.com/shuntarot/uharness", project = "hns", version = "0.13.1" }

[lint.portability]
# hns::mem writes its array from both ports, the form Vivado infers a
# true dual port BRAM from. Veryl asks the user of hns to accept that.
allow_in_dependencies = ["multiple_assign"]
